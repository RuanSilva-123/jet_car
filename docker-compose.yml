# Ambiente de DESENVOLVIMENTO
#   docker compose up -d --build
#   Painel: http://localhost:${APP_PORT}   |   E-mails (Mailpit): http://localhost:${MAILPIT_PORT}

name: jetcar

# Base comum de app, queue e scheduler (mesma imagem; só o app faz o build)
x-php: &php
  pull_policy: never
  image: jetcar-php:dev
  volumes:
    - ./backend:/var/www/html
    - backend_vendor:/var/www/html/vendor
    # Situação do backup (last-backup.json), mostrada em Dados da oficina
    - ./backups:/backups:ro
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE}
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD}
    REDIS_HOST: redis
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      target: dev
    image: jetcar-nginx:dev
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      - app
      - node
    restart: unless-stopped

  app:
    <<: *php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev

  queue:
    <<: *php
    command: php artisan queue:listen --tries=3 --timeout=90

  scheduler:
    <<: *php
    command: php artisan schedule:work

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    image: jetcar-node:dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Backup diário do banco e das fotos (docker/backup). Imagem do próprio Postgres:
  # o pg_dump tem a mesma versão do servidor. Arquivos em ./backups (copie para fora do servidor).
  backup:
    image: postgres:18-alpine
    entrypoint: ["sh", "/scripts/loop.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_DATABASE}
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      TZ: ${BACKUP_TZ:-America/Sao_Paulo}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./docker/backup:/scripts:ro
      - ./backups:/backups
      - ./backend/storage:/storage:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  # Interface web do banco (apenas dev, acessível só desta máquina)
  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  backend_vendor:
  postgres_data:
  redis_data:
  frontend_node_modules:
