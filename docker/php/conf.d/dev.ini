display_errors = On
error_reporting = E_ALL

; O código vem de um bind mount (lento no Windows/macOS). Revalidar a cada 2s
; evita um stat em cada arquivo a cada request sem atrapalhar a edição.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
realpath_cache_size = 4096K
realpath_cache_ttl = 600
